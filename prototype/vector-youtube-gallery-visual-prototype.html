<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Vector YouTube Gallery — Visual Prototype</title>
<meta name="description" content="Interactive visual prototype of a configurable YouTube video gallery: grid, list, featured, hero, shorts, live and masonry layouts with live style controls."/>
<style>
:root{
  --bg:#f7f8fb;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--yt:#ff1f1f;--blue:#2563eb;--purple:#6d28d9;
  --vyg-max:1180px;--vyg-cols:3;--vyg-gap:24px;--vyg-pad:16px;--vyg-radius:18px;--vyg-thumb-radius:14px;
  --vyg-shadow:0 14px 34px rgba(15,23,42,.08);--vyg-title:17px;--vyg-meta:13px;--vyg-lines:2;--vyg-desc-lines:2;--vyg-ratio:16/9;
  --vyg-cta:#2563eb;--vyg-cta-fg:#fff
}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 8% 2%,rgba(37,99,235,.10),transparent 30%),radial-gradient(circle at 95% 12%,rgba(109,40,217,.10),transparent 32%),linear-gradient(180deg,#fff,#f6f7fb 55%,#f4f6fa);color:var(--ink);font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
a{color:inherit;text-decoration:none}button,select,input{font:inherit}
.canvas{padding:52px 28px 92px}.vyg{width:min(100%,var(--vyg-max));margin:auto}.vyg.theme{--vyg-max:880px}.vyg.wide{--vyg-max:1180px}.vyg.full{--vyg-max:100%}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:28px}.top>div:last-child{display:flex;align-items:center;justify-content:flex-end;flex-wrap:wrap;gap:10px}.kicker{display:inline-flex;gap:9px;align-items:center;color:var(--yt);font-size:13px;font-weight:900;letter-spacing:.04em;text-transform:uppercase}.yt{display:inline-grid;place-items:center;width:30px;height:21px;border-radius:7px;background:var(--yt);color:#fff;font-size:10px;box-shadow:0 8px 18px rgba(255,31,31,.18)}h1{margin:.1em 0 0;font-size:clamp(34px,5vw,58px);line-height:.96;letter-spacing:-.055em}.intro{margin:14px 0 0;max-width:720px;color:var(--muted);font-size:clamp(15px,2vw,18px);line-height:1.5}.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;max-width:100%;padding:10px 16px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.86);font-weight:800;text-align:center;box-shadow:0 8px 24px rgba(15,23,42,.06);white-space:normal;overflow-wrap:anywhere}.btn.primary{background:var(--vyg-cta);color:var(--vyg-cta-fg);border-color:color-mix(in srgb,var(--vyg-cta) 70%,white)}
.layout-pill{display:inline-flex;align-items:center;padding:10px 14px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--muted);font-size:13px;font-weight:900;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(var(--vyg-cols),minmax(0,1fr));gap:var(--vyg-gap)}.auto{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}

.thumb{position:relative;display:block;aspect-ratio:var(--vyg-ratio);margin:var(--vyg-pad) var(--vyg-pad) 0;border-radius:var(--vyg-thumb-radius);overflow:hidden;background:#cbd5e1}.flush .thumb{margin:0;border-radius:var(--vyg-radius) var(--vyg-radius) 0 0}.hide-thumb .thumb{display:none}.art{position:absolute;inset:0;background:linear-gradient(145deg,color-mix(in srgb,var(--tone,#64748b) 16%,white),color-mix(in srgb,var(--tone,#64748b) 90%,#0f172a));transform:none}.art:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(15,23,42,.22))}
.scene:before,.scene:after{content:"";position:absolute}.mountain:before{left:-5%;right:-5%;bottom:0;height:60%;background:linear-gradient(145deg,rgba(30,41,59,.45),rgba(21,128,61,.35));clip-path:polygon(0 100%,14% 48%,27% 73%,40% 23%,57% 70%,73% 32%,100% 100%)}.city:before{inset:auto 0 0;height:52%;background:repeating-linear-gradient(90deg,rgba(15,23,42,.75) 0 24px,rgba(30,41,59,.88) 24px 38px);clip-path:polygon(0 35%,9% 18%,18% 45%,28% 20%,39% 55%,51% 12%,66% 46%,78% 24%,90% 55%,100% 30%,100% 100%,0 100%)}.food:before{width:72%;aspect-ratio:1.55;left:14%;top:22%;border-radius:50%;background:radial-gradient(circle at 50% 50%,rgba(255,255,255,.65),transparent 18%),radial-gradient(circle at 35% 45%,#facc15,#f97316 52%,#7c2d12 74%,transparent 75%);box-shadow:0 15px 30px rgba(0,0,0,.25)}.camera:before{width:110px;height:72px;left:50%;top:45%;transform:translate(-50%,-50%);border-radius:16px;background:radial-gradient(circle,#111827 0 24%,#fff 25% 35%,#111827 36% 55%,transparent 56%),linear-gradient(180deg,#334155,#0f172a);box-shadow:0 18px 40px rgba(0,0,0,.35)}.wave:before{inset:auto -5% 0;height:58%;background:radial-gradient(ellipse at 68% 24%,rgba(255,255,255,.85) 0 12%,transparent 13%),linear-gradient(145deg,rgba(20,184,166,.75),rgba(8,47,73,.9));clip-path:polygon(0 54%,12% 42%,26% 56%,42% 38%,58% 50%,75% 28%,100% 45%,100% 100%,0 100%)}.desk:before{inset:52% 0 0;background:linear-gradient(180deg,#d1a270,#8b5e34)}.desk:after{width:110px;height:70px;left:50%;top:46%;transform:translate(-50%,-50%);border-radius:10px;background:linear-gradient(180deg,#1f2937,#0f172a);box-shadow:0 14px 26px rgba(0,0,0,.28)}.church:before{inset:auto 0 0;height:58%;background:radial-gradient(circle at 50% 5%,rgba(250,204,21,.70),transparent 18%),linear-gradient(180deg,rgba(0,0,0,.18),rgba(15,23,42,.75))}.church:after{content:"WAY OF HOLINESS";left:50%;top:45%;transform:translate(-50%,-50%);width:90%;text-align:center;color:rgba(255,255,255,.78);font-size:clamp(11px,2vw,18px);font-weight: .overlay .thumb:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(15,23,42,.12),rgba(15,23,42,.48));z-index:2}.duration,.badge{position:absolute;z-index:3;display:inline-flex;align-items:center;gap:6px;min-height:24px;border-radius:999px;font-size:12px;font-weight:950;line-height:1;white-space:nowrap}.duration{right:10px;bottom:10px;padding:5px 8px;background:rgba(2,6,23,.82);color:#fff}.duration.top_right{top:10px;bottom:auto}.duration.top_left{top:10px;right:auto;left:10px;bottom:auto}.duration.bottom_left{right:auto;left:10px}.badge{left:10px;top:10px;padding:7px 10px;text-transform:uppercase;background:var(--badge,#2563eb);color:#fff;box-shadow:0 8px 18px rgba(0,0,0,.16)}.soft{background:color-mix(in srgb,var(--badge,#2563eb) 16%,white);color:color-mix(in srgb,var(--badge,#2563eb) 72%,black);box-shadow:none}.outline{background:rgba(255,255,255,.9);color:color-mix(in srgb,var(--badge,#2563eb) 82%,black);border:1px solid color-mix(in srgb,var(--badge,#2563eb) 35%,white);box-shadow:none}.minimal-badge{background:rgba(15,23,42,.72);color:#fff;box-shadow:none}.play{position:absolute;z-index:4;left:50%;top:50%;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.9);box-shadow:0 18px 40px rgba(0,0,0,.22);font-size:20px;padding-left:3px}
.body{padding:var(--vyg-pad);display:flex;flex-direction:column;gap:11px;flex:1;min-width:0}.title{margin:0;color:#0f172a;font-size:var(--vyg-title);line-height:1.28;font-weight:880;letter-spacing:-.025em;display:-webkit-box;-webkit-line-clamp:var(--vyg-lines);-webkit-box-orient:vertical;overflow:hidden}.channel{display:flex;align-items:center;gap:9px;min-width:0;color:#334155;font-size:13px;font-weight:760}.avatar{width:30px;height:30px;border-radius:999px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--aa),var(--ab));font-weight:950;font-size:12px;flex:0 0 auto;box-shadow:inset 0 0 0 2px rgba(255,255,255,.65)}.name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.check{width:16px;height:16px;border-radius:50%;display:grid;place-items:center;background:#64748b;color:#fff;font-size:10px;font-weight:900;flex:0 0 auto}.meta{display:flex;align-items:center;flex-wrap:wrap;gap:7px;color:var(--muted);font-size:var(--vyg-meta);line-height:1.35}.dot{width:3px;height:3px;border-radius:50%;background:#cbd5e1}.desc{margin:0;color:#475569;font-size:14px;line-height:1.48;display:-webkit-box;-webkit-line-clamp:var(--vyg-desc-lines);-webkit-box-orient:vertical;overflow:hidden}.foot{margin-top:auto;padding-top:6px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;min-width:0}.cta{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-width:0;max-width:100%;min-height:38px;padding:9px 13px;border-radius:12px;background:var(--vyg-cta);color:var(--vyg-cta-fg);font-size:13px;font-weight:900;text-align:center;box-shadow:0 12px 20px color-mix(in srgb,var(--vyg-cta) 22%,transparent);white-space:normal;overflow-wrap:anywhere}.cta.secondary{background:#0f172a;color:#fff}.cta.outline{background:#fff;color:#0f172a;border:1px solid var(--line);box-shadow:none}.cta.ghost{background:transparent;color:#0f172a;box-shadow:none}.cta.icon_only{width:38px;padding:0;font-size:0}.actions{display:flex;gap:8px;flex:0 0 auto;margin-left:auto}.icon{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(15,23,42,.05);font-weight:950}
.load{display:flex;justify-content:center;margin-top:30px}.row{flex-direction:row}.row .thumb{width:min(34%,340px);min-width:240px;margin:12px;flex:0 0 auto}.row .body{padding:18px 18px 18px 4px}.feature{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(340px,.9fr);gap:clamp(24px,4vw,46px);align-items:center;margin-bottom:34px;overflow:visible}.feature-media{border-radius:26px;overflow:hidden;box-shadow:0 24px 60px rgba(15,23,42,.15);border:1px solid rgba(15,23,42,.1)}.feature-media .thumb{margin:0;border-radius:26px}.feature-copy{display:flex;flex-direction:column;align-items:flex-start;gap:16px;min-width:0}.feature-copy h2{margin:0;font-size:clamp(34px,4.6vw,64px);line-height:.95;letter-spacing:-.055em}.feature-copy p{margin:0;color:#475569;font-size:17px;line-height:1.55;max-width:620px}.section-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:20px;margin:34px 0 18px}.section-head h2{margin:0;font-size:22px;letter-spacing:-.03em}.shorts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));align-items:start;gap:var(--vyg-gap)}.short{--vyg-ratio:9/16;max-width:290px;width:100%;justify-self:center}.live-section{margin-bottom:38px}.live-head{display:flex;align-items:center;flex-wrap:wrap;gap:12px;margin-bottom:16px}.live-head h2{margin:0;font-size:24px}.pill{display:inline-flex;align-items:center;min-height:28px;padding:6px 10px;border-radius:999px;background:#fee2e2;color:#dc2626;font-size:12px;font-weight:950;text-transform:uppercase}.up{background:#ede9fe;color:#7c3aed}.re{background:#dbeafe;color:#2563eb}.live-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:var(--vyg-gap)}.upcoming,.replays{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:var(--vyg-gap)}.masonry{column-count:var(--vyg-cols);column-gap:var(--vyg-gap)}.masonry .card{display:inline-flex;width:100%;margin:0 0 var(--vyg-gap);break-inside:avoid}.masonry .card:nth-child(2n) .thumb{aspect-ratio:4/3}.masonry .card:nth-child(3n) .thumb{aspect-ratio:1/1}
.carousel{position:relative;overflow:visible;padding:26px 42px 22px;border-radius:30px;border:1px solid rgba(15,23,42,.08);background:rgba(255,255,255,.58);box-shadow:0 20px 60px rgba(15,23,42,.07)}.track{display:flex;gap:var(--vyg-gap);overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding-inline:14px;padding:18px 14px 30px;scrollbar-width:none}.track::-webkit-scrollbar{display:none}.carousel .card{flex:0 0 min(330px,82vw);scroll-snap-align:center;scroll-margin-inline:14px}.active{position:relative;z-index:2;outline:3px solid rgba(109,40,217,.72);outline-offset:4px;transform:translateY(-5px)}.nav{position:absolute;top:48%;transform:translateY(-50%);z-index:4;width:48px;height:48px;border-radius:50%;background:#fff;border:1px solid rgba(15,23,42,.1);box-shadow:0 18px 36px rgba(15,23,42,.14);font-size:24px;font-weight:950;color:#4c1d95}.prev{left:12px}.next{right:12px}.dots{display:flex;justify-content:center;gap:9px}.dotbtn{width:9px;height:9px;border:0;border-radius:999px;background:#cbd5e1}.dotbtn.on{width:28px;background:var(--purple)}.hint{display:flex;justify-content:center;flex-wrap:wrap;gap:18px;color:#475569;font-size:13px;font-weight:800;margin-top:15px}.trust{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:34px;padding:16px;border-radius:24px;background:rgba(255,255,255,.72);border:1px solid rgba(15,23,42,.08);box-shadow:0 14px 40px rgba(15,23,42,.06)}.trust div{padding:12px}.trust b{display:block;font-size:14px}.trust span{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.toggle{position:fixed;top:22px;right:22px;z-index:20;height:46px;padding:0 16px;border:0;border-radius:999px;background:#0f172a;color:#fff;font-weight:900;box-shadow:0 18px 40px rgba(15,23,42,.25)}.panel{position:fixed;top:82px;right:22px;bottom:22px;z-index:19;width:min(390px,calc(100vw - 28px));display:flex;flex-direction:column;border-radius:24px;border:1px solid #d9dee8;background:rgba(255,255,255,.94);box-shadow:0 24px 80px rgba(15,23,42,.24);backdrop-filter:blur(16px);overflow:hidden;transition:.2s}.panel.hide{transform:translateX(calc(100% + 40px));opacity:0;pointer-events:none}.phead{padding:18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:14px}.phead h2{margin:0;font-size:18px}.phead p{margin:4px 0 0;color:var(--muted);font-size:12px;line-height:1.35}.close{width:34px;height:34px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:18px}.pbody{overflow:auto;padding:16px 18px 20px}.group{padding:13px;border-radius:18px;border:1px solid rgba(15,23,42,.08);background:rgba(248,250,252,.82);margin-bottom:12px}.group h3{margin:0 0 11px;font-size:12px;letter-spacing:.08em;color:#334155;text-transform:uppercase}.crow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}.ctrl{display:flex;flex-direction:column;gap:5px;font-size:11px;color:#475569;font-weight:850}.ctrl.full{grid-column:1/-1}.ctrl select,.ctrl input[type=range],.ctrl input[type=text]{width:100%;min-height:36px;border:1px solid var(--line);border-radius:11px;background:#fff;color:#0f172a;padding:7px 9px}.checks{display:grid;grid-template-columns:1fr 1fr;gap:8px}.chk{display:flex;align-items:center;gap:8px;min-height:32px;padding:8px;border-radius:12px;border:1px solid var(--line);background:#fff;color:#334155;font-size:12px;font-weight:800}.chk input{accent-color:var(--blue)}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:30;max-width:min(680px,calc(100vw - 28px));padding:12px 16px;border-radius:999px;background:rgba(15,23,42,.93);color:#fff;font-size:13px;font-weight:800;box-shadow:0 20px 50px rgba(15,23,42,.25)}
@media(max-width:1050px){.top{align-items:flex-start;flex-direction:column}.top>div:last-child{justify-content:flex-start}.feature{grid-template-columns:1fr}.trust{grid-template-columns:repeat(2,1fr)}.masonry{column-count:min(var(--vyg-cols),2)}}@media(max-width:760px){.canvas{padding:36px 16px 70px}.grid{grid-template-columns:1fr!important}.row{flex-direction:column}.row .thumb{width:auto;min-width:0;margin:var(--vyg-pad) var(--vyg-pad) 0}.row .body{padding:var(--vyg-pad)}.feature-copy h2{font-size:clamp(30px,11vw,44px)}.feature-copy p:last-child{display:flex;flex-wrap:wrap;gap:10px}.masonry{column-count:1}.carousel{padding:18px 10px;border-radius:22px}.track{padding:18px 12px 26px;scroll-padding-inline:12px}.carousel .card{flex-basis:min(300px,76vw);scroll-margin-inline:12px}.nav{width:40px;height:40px;font-size:22px}.prev{left:8px}.next{right:8px}.trust{grid-template-columns:1fr}.toggle{top:auto;right:16px;bottom:16px}.panel{top:12px;right:12px;bottom:76px}.toast{bottom:84px}}

<body>
<button id="toggle" class="toggle">Gallery Settings</button>
<aside id="panel" class="panel" aria-label="Prototype controls">
  <div class="phead"><div><h2>Prototype Controls</h2><p>Preview-only controls. In WordPress these become Admin, Gutenberg, Elementor, or shortcode settings.</p></div><button id="close" class="close">×</button></div>
  <div class="pbody">
    <div class="group"><h3>Layout</h3><div class="crow">
      <label class="ctrl">Layout<select id="layout"><option>grid</option><option>list</option><option>featured</option><option>hero</option><option>shorts</option><option>live</option><option>masonry</option><option>carousel</option></select></label>
      <label class="ctrl">Width<select id="width"><option>theme</option><option selected>wide</option><option>full</option></select></label>
      <label class="ctrl">Columns<input id="columns" type="range" min="1" max="6" value="3"></label>
      <label class="ctrl">Items<input id="items" type="range" min="3" max="12" value="9"></label>
      <label class="ctrl full">Gap<input id="gap" type="range" min="10" max="42" value="24"></label>
    </div></div>
    <div class="group"><h3>Card Design</h3><div class="crow">
      <label class="ctrl">Style<select id="style"><option>minimal</option><option selected>bordered</option><option>elevated</option><option>flat</option><option>commerce</option></select></label>
      <label class="ctrl">Density<select id="density"><option>compact</option><option selected>comfortable</option><option>editorial</option></select></label>
      <label class="ctrl">Card radius<input id="radius" type="range" min="0" max="34" value="18"></label>
      <label class="ctrl">Thumb radius<input id="thumbRadius" type="range" min="0" max="28" value="14"></label>
      <label class="ctrl">Padding<input id="padding" type="range" min="0" max="28" value="16"></label>
      <label class="ctrl">Shadow<select id="shadow"><option>none</option><option selected>soft</option><option>medium</option></select></label>
    </div></div>
    <div class="group"><h3>Thumbnail</h3><div class="crow">
      <label class="ctrl">Ratio<select id="ratio"><option value="16/9" selected>16:9</option><option value="4/3">4:3</option><option value="1/1">1:1</option><option value="9/16">9:16</option><option value="auto">Auto</option></select></label>
      <label class="ctrl">Duration pos<select id="durPos"><option>bottom_right</option><option>bottom_left</option><option>top_right</option><option>top_left</option></select></label>
    </div><div class="checks">
      <label class="chk"><input id="showThumb" type="checkbox" checked>Thumbnail</label><label class="chk"><input id="showDuration" type="checkbox" checked>Duration</label>
      <label class="chk"><input id="showPlay" type="checkbox">Play icon</label><label class="chk"><input id="overlay" type="checkbox">Overlay</label>
    </div></div>
    <div class="group"><h3>Content</h3><div class="crow">
      <label class="ctrl">Title lines<select id="titleLines"><option>1</option><option selected>2</option><option>3</option></select></label>
      <label class="ctrl">Description lines<select id="descLines"><option>1</option><option selected>2</option><option>3</option></select></label>
    </div><div class="checks">
      <label class="chk"><input id="showTitle" type="checkbox" checked>Title</label><label class="chk"><input id="showChannel" type="checkbox" checked>Channel</label>
      <label class="chk"><input id="showAvatar" type="checkbox" checked>Avatar</label><label class="chk"><input id="showVerified" type="checkbox" checked>Verified</label>
      <label class="chk"><input id="showMeta" type="checkbox" checked>Metadata</label><label class="chk"><input id="showDesc" type="checkbox">Description</label>
    </div></div>
    <div class="group"><h3>Metadata</h3><div class="checks">
      <label class="chk"><input id="mViews" type="checkbox" checked>Views</label><label class="chk"><input id="mDate" type="checkbox" checked>Date</label>
      <label class="chk"><input id="mLikes" type="checkbox">Likes</label><label class="chk"><input id="mStatus" type="checkbox" checked>Status</label>
      <label class="chk"><input id="mSchedule" type="checkbox" checked>Schedule</label><label class="chk"><input id="mDuration" type="checkbox">Duration</label>
    </div></div>
    <div class="group"><h3>CTA & Actions</h3><div class="crow">
      <label class="ctrl">CTA behavior<select id="ctaMode"><option selected>mapped_only</option><option>always</option><option>hidden</option></select></label>
      <label class="ctrl">CTA style<select id="ctaStyle"><option>primary</option><option>secondary</option><option>outline</option><option>ghost</option><option>icon_only</option></select></label>
      <label class="ctrl full">CTA label<input id="ctaLabel" type="text" value="View Product"></label>
    </div><div class="checks">
      <label class="chk"><input id="actions" type="checkbox" checked>Actions</label><label class="chk"><input id="share" type="checkbox" checked>Share</label>
      <label class="chk"><input id="youtube" type="checkbox" checked>YouTube</label><label class="chk"><input id="loadmore" type="checkbox" checked>Load more</label>
    </div></div>
    <div class="group"><h3>Badges</h3><div class="crow">
      <label class="ctrl">Badge type<select id="badgeType"><option>featured</option><option>live</option><option>upcoming</option><option>replay</option><option>short</option><option>new</option><option>product</option></select></label>
      <label class="ctrl">Badge style<select id="badgeStyle"><option>solid</option><option>soft</option><option>outline</option><option>minimal</option></select></label>
    </div><div class="checks"><label class="chk"><input id="badge" type="checkbox">Status badge</label></div></div>
  </div>
</aside>
<main class="canvas"><section id="widget" class="vyg wide"><div id="root"></div></section></main>
<div id="toast" class="toast">Settings panel is prototype-only. The gallery canvas demonstrates the visitor-facing output.</div>
<script>
const V=[
['The Great World Reset Part 2','The Way Of Holiness Broadcast','17 views','11 hours ago','1:17:10','4 likes','A teaching broadcast with scripture references and a complete replay experience.','replay',true,'church','#d8c7a5','#0f3f3f','#111827','#0f766e','#111827'],
['REPOST: Strong Mind In The Day Of Tribulation','The Way Of Holiness Broadcast','36 views','3 days ago','1:09:12','6 likes','A replay sermon focused on endurance, spiritual discipline, and a prepared mindset.','replay',false,'church','#e2d6bd','#174e4a','#020617','#0f766e','#111827'],
['Exploring the Canadian Rockies (4K Scenic Adventure)','Wander More','125K views','2 days ago','12:45','4.3K','An unforgettable journey through turquoise lakes, towering peaks, and scenic trails.','new',true,'mountain','#dbeafe','#0f766e','#0f172a','#0ea5e9','#0f172a'],
['Creamy Garlic Pasta Recipe — Easy & Delicious','Cooking with Lia','89K views','5 days ago','8:32','2.1K','A quick and creamy garlic pasta recipe that works for any weeknight dinner.','standard',true,'food','#fff7ed','#f97316','#7c2d12','#f97316','#7c2d12'],
['5 Cinematic Camera Movements You Can Do Anywhere','Frame by Frame','76K views','1 week ago','10:15','3.2K','Level up your videos with five simple, repeatable camera movements.','featured',false,'camera','#fed7aa','#475569','#0f172a','#64748b','#0f172a'],
['Morning Surf Session at Sunset Beach','Ocean Life','38K views','2 weeks ago','6:18','1.6K','Crisp waves, soft sunlight, and a peaceful morning on the coast.','short',false,'wave','#fde68a','#14b8a6','#083344','#14b8a6','#083344'],
['48 Hours in Tokyo — Travel Guide & Tips','Around The World','215K views','2 weeks ago','15:20','5.7K','Make the most of a short Tokyo trip with a practical city guide.','standard',true,'city','#fca5a5','#334155','#020617','#ec4899','#0f172a'],
['Minimal Desk Setup for Maximum Productivity','Tech Simplified','54K views','1 week ago','7:21','2.4K','A calm, focused desk setup designed for deep work and practical productivity.','standard',false,'desk','#e0f2fe','#94a3b8','#78350f','#2563eb','#0f172a'],
['Landscape Photography Q&A','PhotoJourneys','843 waiting','Starts in 2h 15m','UPCOMING','','A live Q&A covering composition, light, gear choices, and workflow.','upcoming',false,'camera','#dbeafe','#64748b','#0f172a','#2563eb','#0f172a'],
['Sunday Morning Worship — Live','Faith Church','1.2K watching','Started 23 minutes ago','LIVE','','Live worship and teaching broadcast streaming now.','live',false,'church','#fca5a5','#7f1d1d','#020617','#dc2626','#111827'],
['Paris in Just 27 Seconds','Wander More','92K views','2 weeks ago','0:27','3K','A short vertical city snapshot with quick cuts and memorable landmarks.','short',true,'city','#bfdbfe','#6366f1','#111827','#0ea5e9','#0f172a'],
['Spirit and Truth Worshippers — June 20, 2026','The Way Of Holiness Broadcast','20 views','1 week ago','15:34','2 likes','A worship replay with focused metadata and a clean replay treatment.','replay',false,'church','#143d3d','#0f766e','#020617','#0f766e','#111827']
].map((x,i)=>({id:i+1,title:x[0],channel:x[1],views:x[2],date:x[3],duration:x[4],likes:x[5],desc:x[6],status:x[7],mapped:x[8],scene:x[9],colors:x.slice(10,13),avatar:x.slice(13,15)}));
const $=id=>document.getElementById(id), ids=['layout','width','columns','items','gap','style','density','radius','thumbRadius','padding','shadow','ratio','durPos','showThumb','showDuration','showPlay','overlay','showTitle','showChannel','showAvatar','showVerified','showMeta','showDesc','titleLines','descLines','mViews','mDate','mLikes','mStatus','mSchedule','mDuration','ctaMode','ctaStyle','ctaLabel','actions','share','youtube','loadmore','badge','badgeType','badgeStyle'];
let s={}, carousel=2;
function val(id){let e=$(id);return e.type==='checkbox'?e.checked:e.type==='range'?+e.value:e.value}
function sync(){ids.forEach(id=>s[id]=val(id));if(s.layout==='shorts'){$('ratio').value='9/16';s.ratio='9/16'}if(s.layout==='live'){$('badge').checked=true;s.badge=true}}
function tokens(){const w=$('widget');w.className='vyg '+s.width;let d={compact:[15,12,Math.min(s.padding,12),1],comfortable:[17,13,s.padding,2],editorial:[20,14,Math.max(s.padding,20),2]}[s.density];let sh={none:'none',soft:'0 14px 34px rgba(15,23,42,.08)',medium:'0 22px 54px rgba(15,23,42,.14)'}[s.shadow];w.style.cssText=`--vyg-cols:${s.columns};--vyg-gap:${s.gap}px;--vyg-radius:${s.radius}px;--vyg-thumb-radius:${s.thumbRadius}px;--vyg-pad:${d[2]}px;--vyg-shadow:${sh};--vyg-title:${d[0]}px;--vyg-meta:${d[1]}px;--vyg-lines:${s.titleLines};--vyg-desc-lines:${s.descLines};--vyg-ratio:${s.ratio==='auto'?'16/10':s.ratio.replace('/',' / ')};`}
function e(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function binfo(t){return {featured:['Featured','#6d28d9'],live:['Live','#ef233c'],upcoming:['Upcoming','#7c3aed'],replay:['Replay','#2563eb'],short:['Short','#0ea5e9'],new:['New','#16a34a'],product:['Product','#f97316'],standard:['Video','#2563eb']}[t]||['Featured','#6d28d9']}
function thumb(v,o={}){let [lab,col]=binfo(o.bt||s.badgeType);if(s.layout==='live')[lab,col]=binfo(v.status);let badge=(s.badge||o.badge)?`<span class="badge ${s.badgeStyle==='minimal'?'minimal-badge':s.badgeStyle}" style="--badge:${col}">${e(lab)}</span>`:'';return `<a class="thumb" href="#" aria-label="Play ${e(v.title)}"><span class="art" style="--tone:${v.colors[1]}"></span>${badge}${s.showDuration?`<span class="duration ${s.durPos}">${e(v.duration)}</span>`:''}${(s.showPlay||o.play)?'<span class="play">▶</span>':''}</a>`}
function ch(v){return s.showChannel?`<div class="channel">${s.showAvatar?`<span class="avatar" style="--aa:${v.avatar[0]};--ab:${v.avatar[1]}">${e(v.channel[0])}</span>`:''}<span class="name">${e(v.channel)}</span>${s.showVerified?'<span class="check">✓</span>':''}</div>`:''}
function meta(v){if(!s.showMeta)return'';let a=[];if(s.mViews)a.push(v.views);if(s.mDate)a.push(v.date);if(s.mLikes&&v.likes)a.push(v.likes);if(s.mStatus&&s.layout==='live')a.push(v.status);if(s.mSchedule&&s.layout==='live')a.push(v.status==='upcoming'?'Today · 3:00 PM ET':v.status==='live'?'Live now':'Recently streamed');if(s.mDuration)a.push(v.duration);return `<div class="meta">${a.filter(Boolean).map((x,i)=>(i?'<span class="dot"></span>':'')+`<span>${e(x)}</span>`).join('')}</div>`}
function shouldCta(v,force=false){return s.ctaMode==='always'||force||(s.ctaMode==='mapped_only'&&v.mapped)}
function cta(v,force=false){if(!shouldCta(v,force))return'';let label=s.layout==='live'?(v.status==='live'?'Watch Live':v.status==='upcoming'?'Set Reminder':'Watch Replay'):s.ctaLabel;return `<a class="cta ${s.ctaStyle}" href="#"><span>▣</span><span>${e(label)}</span></a>`}
function acts(){if(!s.actions)return'';return `<div class="actions">${s.youtube?'<button class="icon">↗</button>':''}${s.share?'<button class="icon">⌁</button>':''}<button class="icon">⋮</button></div>`}
function card(v,mode='standard',o={}){return `<article class="card ${s.style} ${mode==='row'?'row':''} ${mode==='short'?'short flush':''} ${!s.showThumb?'hide-thumb':''} ${s.overlay||o.overlay?'overlay':''}">${thumb(v,o)}<div class="body">${s.showTitle?`<h3 class="title"><a href="#">${e(v.title)}</a></h3>`:''}${ch(v)}${meta(v)}${(s.showDesc||o.desc)?`<p class="desc">${e(v.desc)}</p>`:''}<div class="foot">${cta(v,o.forceCta)}${acts()}</div></div></article>`}
function head(t,d,k='Vector YouTube Gallery'){return `<div class="top"><div><div class="kicker"><span class="yt">▶</span>${e(k)}</div><h1>${e(t)}</h1><p class="intro">${e(d)}</p></div><div><span class="layout-pill">${e(s.layout)} layout</span> <a class="btn" href="#"><span class="yt">▶</span>View channel ↗</a></div></div>`}
function load(label='Load More Videos'){return s.loadmore?`<div class="load"><button class="btn">${e(label)}⌄</button></div>`:''}
function trust(){return `<div class="trust"><div><b>Lazy loaded</b><span>Fast rendering</span></div><div><b>Privacy safe</b><span>No front-end API calls</span></div><div><b>Accessible</b><span>Keyboard friendly</span></div><div><b>Builder ready</b><span>Admin, Gutenberg, Elementor</span></div></div>`}
function items(n=s.items){return V.slice(0,n)}
function grid(){return head('Latest Videos','A polished responsive grid with strong thumbnails, clean card hierarchy, compact metadata, and optional product CTAs.')+`<div class="grid">${items().map(v=>card(v)).join('')}</div>`+load()+trust()}
function list(){return head('Latest Videos','A professional media-list layout for dense archives, teaching libraries, tutorials, and replay pages.')+`<div class="list">${items().map(v=>card(v,'row',{desc:true})).join('')}</div>`+load()}
function featured(){let f=V[2], rest=[V[3],V[4],V[5],V[6],V[7],V[11]];return head('Featured Videos','One highlighted primary video with a supporting gallery below. Stronger than Grid, simpler than Hero.')+`<section class="feature"><div class="feature-media">${thumb(f,{badge:true,bt:'featured',play:true})}</div><div class="feature-copy"><span class="badge soft" style="position:static;--badge:#6d28d9">Featured</span><h2>${e(f.title)}</h2>${ch(f)}${meta(f)}<p>${e(f.desc)}</p><p>${cta(f,true)} <a class="btn" href="#">Watch on YouTube ↗</a></p></div></section><div class="section-head"><h2>More Videos</h2><a class="btn" href="#">View all videos →</a></div><div class="grid auto">${rest.map(v=>card(v)).join('')}</div>`+load()}
function hero(){let f=V[2], rest=[V[4],V[6],V[0],V[3],V[5],V[7]];return head('Editorial Video Showcase','A large primary video with rich supporting information and compact secondary cards for a premium landing-page feel.')+`<section class="feature"><div class="feature-media">${thumb(f,{badge:true,bt:'featured',play:true})}</div><div class="feature-copy"><span class="badge soft" style="position:static;--badge:#2563eb">Featured video</span><h2>${e(f.title)}</h2>${ch(f)}${meta(f)}<p>${e(f.desc)} The hero variant gives the primary video more narrative space and clearer CTAs.</p><p>${cta(f,true)} <a class="btn" href="#">Read more</a></p></div></section><div class="section-head"><h2>Recommended next</h2></div><div class="grid auto">${rest.map(v=>card(v)).join('')}</div>`}
function shorts(){let a=[V[5],V[10],V[6],V[4],V[3],V[7],V[8],V[2]];return head('Latest Shorts','A vertical-first layout optimized for 9:16 thumbnails, mobile scanning, and compact metadata.')+`<div class="shorts">${a.slice(0,s.items).map(v=>card(v,'short',{badge:s.badge,bt:'short'})).join('')}</div>`+load('Load More Shorts')}
function live(){let live=V.filter(v=>v.status==='live'), up=V.filter(v=>v.status==='upcoming'), re=V.filter(v=>v.status==='replay');return head('Live & Upcoming','A status-driven layout with clear sections for live streams, upcoming broadcasts, and recent replays.','Live Gallery')+`<section class="live-section"><div class="live-head"><h2>Live Now</h2><span class="pill">${live.length} live</span></div><div class="live-grid">${live.map(v=>card(v,'standard',{badge:true,bt:'live',forceCta:true,desc:true,play:true,overlay:true})).join('')}</div></section><section class="live-section"><div class="live-head"><h2>Upcoming</h2><span class="pill up">${up.length} upcoming</span></div><div class="upcoming">${up.concat(V[1],V[4]).slice(0,3).map(v=>card({...v,status:'upcoming',duration:'UPCOMING'},'standard',{badge:true,bt:'upcoming',forceCta:true})).join('')}</div></section><section class="live-section"><div class="live-head"><h2>Replays</h2><span class="pill re">Recent replays</span></div><div class="replays">${re.map(v=>card(v,'standard',{badge:true,bt:'replay'})).join('')}</div></section>`}
function masonry(){return head('Masonry Gallery','A CSS-first waterfall layout with varied card rhythm, controlled spacing, and no heavy layout engine.')+`<div class="masonry">${items(12).map(v=>card(v,'standard',{desc:v.id%2===0})).join('')}</div>`+load()+trust()}
function carouselView(){let a=items(8);return head('Featured Video Carousel','A horizontal slider-style gallery with consistent card widths, visible controls, dots, and active-card treatment.')+`<section class="carousel"><button id="prev" class="nav prev">‹</button><div class="track">${a.map((v,i)=>card(v).replace('card ',`card ${i===carousel?'active ':''}`)).join('')}</div><button id="next" class="nav next">›</button><div class="dots">${a.map((_,i)=>`<button class="dotbtn ${i===carousel?'on':''}" data-dot="${i}"></button>`).join('')}</div><div class="hint"><span>← / → navigate</span><span>Home goes to first</span><span>End goes to last</span><span>Reduced motion respected</span></div></section>`+trust()}
function render(){sync();tokens();let map={grid,list,featured,hero,shorts,live,masonry,carousel:carouselView};$('root').innerHTML=map[s.layout]();if(s.layout==='carousel'){let max=items(8).length-1,go=i=>{carousel=Math.max(0,Math.min(max,i));render();};$('prev').onclick=()=>go(carousel-1);$('next').onclick=()=>go(carousel+1);document.querySelectorAll('[data-dot]').forEach(d=>d.onclick=()=>go(+d.dataset.dot));requestAnimationFrame(()=>document.querySelector('.carousel .active')?.scrollIntoView({block:'nearest',inline:'center',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'}))}}
ids.forEach(id=>$(id).addEventListener('input',render));ids.forEach(id=>$(id).addEventListener('change',render));$('toggle').onclick=()=>$('panel').classList.toggle('hide');$('close').onclick=()=>$('panel').classList.add('hide');if(window.innerWidth<=760){$('panel').classList.add('hide')}setTimeout(()=>$('toast').style.display='none',7000);render();
</script>
